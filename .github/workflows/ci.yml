name: CI

on:
  push:
    branches: [main, 'rewrite/**']
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Taken from the packageManager field in package.json.
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # A bare hostname, because a ':port' in this value is read by
      # path-to-regexp as a named parameter and breaks every rewritten request
      # inside the worker (Phase 0.4). The build never calls it.
      - name: Build
        run: pnpm build
        env:
          API_ORIGIN: https://api.invalid

  contract:
    name: Contract drift against the API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Set the OPENAPI_SPEC_URL repository variable to the backend's committed
    # openapi.json (raw.githubusercontent.com/…/openapi.json) or to a deployed
    # /openapi.json. Skipped until then rather than failing every run.
    if: vars.OPENAPI_SPEC_URL != ''

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Phase 2's backend drift check regenerates the spec from the zod schemas
      # and diffs it, which catches a stale *commit* but not a route that was
      # never registered — the output matches the registry either way. Phase 4
      # hit exactly that: 13 routes existed in code and not in the spec, and
      # only the frontend's typecheck noticed. This is the step that closes it.
      - name: Regenerate the API types from the spec
        run: pnpm sync:types
        env:
          OPENAPI_SOURCE: ${{ vars.OPENAPI_SPEC_URL }}

      - name: Fail if the committed types are stale
        run: |
          if ! git diff --exit-code --stat -- src/lib/api-types.ts; then
            echo "::error::src/lib/api-types.ts is out of date. Run 'pnpm sync:types' and commit the result."
            exit 1
          fi

      # Regenerated types are only useful if the app still compiles against them.
      - name: Typecheck against the regenerated types
        run: pnpm typecheck
